id: ontology-playground
name: ontology-playground
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
  data:
    enabled: false
  staticHosting:
    enabled: true
    folder: build
    buildCommand: npm run build:rayfin
    indexDocument: index.html
  functions:
    enabled: true
    buildCommand: npm install && npm run build
